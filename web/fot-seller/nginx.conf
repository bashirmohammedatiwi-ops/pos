server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    location = /auth/seller-lookup {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/seller-login {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/seller-refresh {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # قناة فورية للبائع (SSE): بلا تخزين مؤقت ومهلة طويلة
    location = /api/seller/events {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    # تطبيق الفريق: الدخول وواجهة الموظف (والوسائط لاحقاً)
    location ~ ^/auth/team-(login|refresh|lookup)$ {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # القناة الحية لتطبيق الفريق (SSE): بلا تخزين مؤقت ومهلة طويلة
    location ~ ^/api/team/(m/)?events$ {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /api/team/ {
        client_max_body_size 12m;
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/seller/ {
        proxy_pass ${FOT_SHOP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 =502 /_shop_down;
    location = /_shop_down {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 502 '{"error":"بيانات المحل لم تصل إلى السيرفر بعد"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
