<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="لوحة المدير — مبيعات كل بائع وكاشير، الفواتير، القطع، العمولات والأهداف" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>FOT Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" hidden>
      <div class="boot-card">
        <h1>تعذّر تحميل لوحة المدير</h1>
        <p id="boot-fallback-msg">قد يكون السبب نسخة قديمة محفوظة في المتصفح بعد التحديث.</p>
        <div class="boot-actions">
          <button type="button" class="boot-primary" onclick="location.reload()">تحديث الصفحة</button>
          <button type="button" class="boot-ghost" onclick="window.__fotResetManager()">مسح الذاكرة وإعادة المحاولة</button>
        </div>
      </div>
    </div>
    <script>
      window.__fotResetManager = function () {
        try {
          localStorage.removeItem('fot_manager_cache_v3');
          localStorage.removeItem('fot_manager_cache');
          sessionStorage.clear();
        } catch (e) {}
        location.reload();
      };
      window.__fotShowBoot = function (msg) {
        var el = document.getElementById('boot-fallback');
        var text = document.getElementById('boot-fallback-msg');
        if (text && msg) text.textContent = msg;
        if (el) {
          el.hidden = false;
          el.classList.add('show');
        }
      };
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && t.tagName === 'SCRIPT') window.__fotShowBoot('تعذّر تحميل ملفات التطبيق. حدّث الصفحة أو امسح الذاكرة.');
      }, true);
      window.addEventListener('unhandledrejection', function () {
        window.__fotShowBoot('حدث خطأ أثناء تشغيل التطبيق. جرّب تحديث الصفحة.');
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          window.__fotShowBoot('التطبيق لم يكتمل التحميل. قد تحتاج تحديثاً قوياً للصفحة.');
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
