<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>FOT POS — الكاشير</title>
    <script>
      (function () {
        if (location.protocol === 'file:') return;
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap';
        document.head.appendChild(l);
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0b1220; color: #e2e8f0; font-family: system-ui, sans-serif; }
    </style>
    <script>
      (function () {
        function recover(force) {
          try {
            if (window.fotDesktop && window.fotDesktop.recover) {
              window.fotDesktop.recover();
              return;
            }
            var n = parseInt(sessionStorage.getItem('fot_boot_reloads') || '0', 10);
            if (!force && n >= 2) return;
            sessionStorage.setItem('fot_boot_reloads', String(n + 1));
            location.reload();
          } catch (e) {
            location.reload();
          }
        }
        setTimeout(function () {
          if (!window.__fotAppReady) recover(false);
        }, 12000);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
