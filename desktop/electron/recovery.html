<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FOT POS — استعادة الشاشة</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.8; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        background: #0f9f76;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>جاري استعادة لوحة التحكم</h1>
      <p>تم مسح الذاكرة المؤقتة بعد توقّف الشاشة. اضغط للمتابعة إن لم تُفتح تلقائياً.</p>
      <button type="button" id="retry">إعادة فتح التطبيق</button>
    </div>
    <script>
      function retry() {
        if (window.fotDesktop && window.fotDesktop.recover) {
          window.fotDesktop.recover();
          return;
        }
        location.reload();
      }
      document.getElementById('retry').onclick = retry;
      try {
        if (!sessionStorage.getItem('fot_recovery_once')) {
          sessionStorage.setItem('fot_recovery_once', '1');
          setTimeout(retry, 1200);
        }
      } catch (e) {
        setTimeout(retry, 1200);
      }
    </script>
  </body>
</html>
