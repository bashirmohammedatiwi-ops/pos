# FOT web hub — public ports 4700–4703, shop sync on 4705.
# Shop POS API stays on the LAN. The VPS stores a seller-safe replica.

services:
  hub:
    build:
      context: ./hub
      dockerfile: Dockerfile
    ports:
      - "4705:4705"
    environment:
      PORT: 4705
      # Secrets come from deploy/.env only (see README) — no defaults here.
      FOT_HUB_SYNC_KEY: ${FOT_HUB_SYNC_KEY:?set FOT_HUB_SYNC_KEY in deploy/.env}
      FOT_HUB_JWT_KEY: ${FOT_HUB_JWT_KEY:?set FOT_HUB_JWT_KEY in deploy/.env}
      FOT_HUB_JWT_HOURS: ${FOT_HUB_JWT_HOURS:-720}
      FOT_HUB_REFRESH_DAYS: ${FOT_HUB_REFRESH_DAYS:-30}
      FOT_HUB_DATA: /data
    volumes:
      - hub-data:/data
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${FOT_HTTP_PORT:-4700}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://hub:4705}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/coming-soon.html:/usr/share/nginx/html/coming-soon.html:ro
    depends_on:
      - seller
      - manager
      - hub
    restart: unless-stopped

  seller:
    build:
      context: ../web/fot-seller
      dockerfile: Dockerfile
    ports:
      - "${FOT_SELLER_PORT:-4701}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://hub:4705}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    depends_on:
      - hub
    restart: unless-stopped

  manager:
    build:
      context: ../web/fot-manager
      dockerfile: Dockerfile
    ports:
      - "${FOT_MANAGER_PORT:-4703}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://hub:4705}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:
