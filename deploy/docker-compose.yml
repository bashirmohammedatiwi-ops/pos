# FOT web hub — host ports 4700–4703 only.
# Shop POS API stays on the LAN (port 5000) and is never published here.

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${FOT_HTTP_PORT:-4700}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://host.docker.internal:5000}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/coming-soon.html:/usr/share/nginx/html/coming-soon.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seller
    restart: unless-stopped

  seller:
    build:
      context: ../web/fot-seller
      dockerfile: Dockerfile
    ports:
      - "${FOT_SELLER_PORT:-4701}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://host.docker.internal:5000}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

