# FOT web hub — host ports 4700–4703 only.
# Shop POS API stays on the LAN (port 5000) and is never published here.

services:
  # Shop PC connects outbound here (no inbound 5000). Reverse tunnel lands on :5000.
  shop-tunnel:
    image: jpillora/chisel:1.11.3
    network_mode: host
    command: server --reverse --port 4704 --auth ${FOT_TUNNEL_AUTH:-fot:e7Kq9mN2pL4xW8vR}
    restart: unless-stopped

  # Host-network forward: tunnel listens on VPS 127.0.0.1:5000,
  # Docker cannot see that address, so this publishes it on 15000 for containers.
  shop-proxy:
    image: alpine/socat
    network_mode: host
    command: TCP-LISTEN:15000,fork,reuseaddr,keepalive TCP:127.0.0.1:5000
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${FOT_HTTP_PORT:-4700}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://host.docker.internal:15000}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/coming-soon.html:/usr/share/nginx/html/coming-soon.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seller
      - shop-proxy
      - shop-tunnel
    restart: unless-stopped

  seller:
    build:
      context: ../web/fot-seller
      dockerfile: Dockerfile
    ports:
      - "${FOT_SELLER_PORT:-4701}:80"
    environment:
      FOT_SHOP_API_URL: ${FOT_SHOP_API_URL:-http://host.docker.internal:15000}
      NGINX_ENVSUBST_FILTER: FOT_SHOP_API_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - shop-proxy
    restart: unless-stopped

