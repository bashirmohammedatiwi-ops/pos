name: verify

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Verify build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Verify-Build.ps1 -SkipMigrations
